<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catchr Picker — round-trip test</title>
</head>
<body>
  <p>Bouncing back to the extension…</p>
  <script>
    // Experiment C: prove launchWebAuthFlow can open this page and capture a
    // redirect back into the extension. The extension passes its own
    // chrome.identity.getRedirectURL() value as ?redirect=… and we bounce to it.
    const params = new URLSearchParams(location.search);
    const redirect = params.get('redirect');
    if (redirect) {
      // NOTE: scratch-only. The real picker (step 3) must validate that this
      // target is a *.chromiumapp.org URL before redirecting (open-redirect guard).
      location.replace(redirect + '#ok=1');
    } else {
      document.body.innerHTML = '<p>Missing ?redirect= param.</p>';
    }
  </script>
</body>
</html>
